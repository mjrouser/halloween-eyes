# LightDM drop-in: log eyesadmin back in whenever the desktop session ends.
#
# Why: autologin only fires once, at boot. On 2026-09-24 labwc exited when the
# monitors were powered back on, and the Pi sat at the login screen.
#
# Install: see deploy/lightdm/install.sh
[Seat:*]
session-cleanup-script=/usr/local/sbin/eyes-relogin
